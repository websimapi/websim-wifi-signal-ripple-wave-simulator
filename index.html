<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Network Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:400,wght@0,400;0,700&display=swap" relstylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #121212;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
        }
        label {
            display: block;
            margin: 8px 0;
        }
        input[type="range"] {
            width: 200px;
        }
        .value-display {
            color: #4CAF50;
            margin-left: 10px;
        }
        h1 {
            color: #4CAF50;
            margin-top: 0;
            text-align: center;
        }
        .equipment {
            position: absolute;
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: move;
            z-index: 1;
        }
        .equipment:hover {
            transform: scale(1.1);
            box-shadow: 0 0 1px rgba(124, 252, 256, 0.5);
        }
        .router {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #4CAF50, #2E91E6);
            border-radius: 1%;
        }
        .satellite {
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, #2196F3, #F44336);
            clip-path: polygon(0% 0%, 100% 50%, 0% 100%, 50% 65%);
        }
        .tower {
            width: 40px;
            height: 10px;
            background: repeating-linear-gradient(to right, #777, #ddd, #777, #333 5px, #333 5px);
            position: relative;
        }
        .tower::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            height: 11px;
            background: #333;
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 50% 100%);
        }
        #equipmentContainer {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
        }
        .equipmentConstructor {
            padding: 10px;
            background: none;
            cursor: pointer;
            transition: box-shadow 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <canvas id="wifiCanvas"></canvas>
    <div id="equipmentContainer"></div>

    <div class="controls">
        <h1>WiFi Network Simulator</h1>
        
        <label>
            Signal Strength:
            <input type="range" id="signalStrength" min="1" max="10" value="5" step="1">
            <span id="strengthValue" class="value-display">5</span>
        </label>
        
        <label>
            Transmission Speed:
            <input type="range" id="transmissionSpeed" min="1" max="10" value="5" step="1">
            <span id="speedValue" class="value-display">5</span>
        </label>
        
        <label>
            Noise Level:
            <input type="range" id="noiseLevel" min="0" max="10" value="3" step="1">
            <span id="noiseValue" class="value-display">3</span>
        </label>
        
        <label>
            Signal Color:
            <input type="color" id="signalColor" value="#4CAF50">
        </label>
        <div class="equipmentConstructor">
            <button id="addRouter">Add Router</button>
            <button id="addSatellite">Add Satellite</button>
            <button id="addTower">Add Tower</button>
        </div>
    </div>

    <script type="module">
        const canvas = document.getElementById('wifiCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // Get control elements
        const signalStrength = document.getElementById('signalStrength');
        const transmissionSpeed = document.getElementById('transmissionSpeed');
        const noiseLevel = document.getElementById('noiseLevel');
        const signalColor = document.getElementById('signalColor');
        
        // Display values
        const strengthValue = document.getElementById('strengthValue');
        const speedValue = document.getElementById('speedValue');
        const noiseValue = document.getElementById('noiseValue');
        
        // Update value displays
        signalStrength.addEventListener('input', () => strengthValue.textContent = signalStrength.value);
        transmissionSpeed.addEventListener('input', () => speedValue.textContent = transmissionSpeed.value);
        noiseLevel.addEventListener('input', () => noiseValue.textContent = noiseLevel.value);
        
        // Wave properties
        let waves = [];
        const MAX_WAVES = 5;
        
        // Equipment
        const equipment = [];

        const equipmentTypes = {
            routers: [
                {x: canvas.width / 2, y: canvas.height / 2, type: 'router', radius: 0, maxRadius: null, speed: 0, alpha: 1}
            ],
            satellites: [
                {x: 100, y: 0, type: 'satellite', radius: 0, maxRadius: null, speed: 0, alpha: 1}
            ],
            towers: [
                {x: canvas.width / 2, y: canvas.height / 2, type: 'tower', radius: 0, maxRadius: null, speed: 0, alpha: 1}
            ]
        };

        // Equipment constructor
        function createEquipment(type, x, y) {
            const element = document.createElement('div');
            element.className = type;
            x = x ?? (Math.random() * (canvas.width / 2) + canvas.width / 4);
            y = y ?? (Math.random() * (canvas.height / 2) + canvas.height / 4);

            element.style.left = `${x}px`;
            element.style.top = `${y}px`;

            document.getElementById('equipmentContainer').appendChild(element);
            equipment.push({x, y, type});
        }

        // Update wave
        function updateWave(wave) {
            if (wave.type === 'router') {
                wave.radius = 0.5;
                if (Math.random() < 0.1) {
                    waves.push({
                        x: wave.x,
                        y: wave.y,
                        radius: 0,
                        maxRadius: wave.alpha,
                        speed: wave.speed,
                        alpha: 1
                    });
                }
            } else if (wave.type === 'satellite') {
                if (Math.random() < 0.02 * transmissionSpeed.value) {
                    waves.push({
                        x: wave.x,
                        y: wave.y,
                        radius: 0,
                        maxRadius: 100,
                        speed: 2,
                        alpha: 0.6
                    });
                }
            } else if (wave.type === 'tower') {
                if (Math.random() < 0.03 * transmissionSpeed.value) {
                    waves.push({
                        x: wave.x + Math.random() * 10,
                        y: wave.y - 8,
                        radius: 0,
                        maxRadius: 7,
                        speed: 1,
                        alpha: 0.5
                    });
                }
            }
        }

        // Main animation loop
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Add new waves based on transmission speed
            if (Math.random() < (transmissionSpeed.value / 20)) {
                if (waves.length < MAX_WAVES) {
                    waves.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: 0,
                        maxRadius: 50 + Math.random() * 100 * signalStrength.value,
                        speed: 0.5 + Math.random() * 2 * transmissionSpeed.value / 10,
                        alpha: 0.8 - (noiseLevel.value * 0.05)
                    });
                }
            }
            
            // Draw and update waves
            for (let i = waves.length - 1; i >= 0; i--) {
                const wave = waves[i];
                
                // Calculate distortion based on noise level
                const distortionAngle = Math.random() * Math.PI * 2;
                const distortionAmount = Math.max(0, noiseLevel.value * 2);
                
                // Ensure wave properties are valid numbers before drawing
                if (!Number.isFinite(wave.x) || !Number.isFinite(wave.y) || !Number.isFinite(wave.radius)) {
                    waves.splice(i, 1);
                    continue;
                }
                
                ctx.beginPath();
                ctx.arc(
                    wave.x + Math.cos(distortionAngle) * distortionAmount,
                    wave.y + Math.sin(distortionAngle) * distortionAmount,
                    wave.radius, 0, Math.PI * 2
                );
                
                const gradient = ctx.createRadialGradient(
                    wave.x, wave.y, wave.radius * 0.5,
                    wave.x, wave.y, wave.radius
                );
                
                gradient.addColorStop(0, signalColor.value);
                gradient.addColorStop(1, 'transparent');
                
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.globalAlpha = wave.alpha;
                ctx.stroke();
                ctx.globalAlpha = 1;
                
                // Update wave
                wave.radius += wave.speed;
                
                // Remove wave if it's too big
                if (wave.radius > wave.maxRadius) {
                    waves.splice(i, 1);
                }
            }
            
            // Update equipment
            for (const equip of equipment) {
                updateWave(equip);
            }
            
            requestAnimationFrame(animate);
        }

        // Drag and drop equipment creation
        document.querySelector('#addRouter').addEventListener('click', () => {
            createEquipment('router', null, null);
        });

        document.querySelector('#addSatellite').addEventListener('click', () => {
            createEquipment('satellite', null, null);
        });

        document.querySelector('#addTower').addEventListener('click', () => {
            createEquipment('tower', null, null);
        });

        animate();
    </script>

</body>
</html>
